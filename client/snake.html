<!doctype html>
<html lang="en" data-sec="games">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Snake</title>
    <link rel="icon" href="/ic-games.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/ic-games.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#bd332d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6e1b17" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/snake.css" />
  </head>
  <body class="sn">
    <!-- Back, as the app's other pages have it, and the score. -->
    <header class="sn-hd">
      <button type="button" class="sn-back" id="sn-bk">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back
      </button>
      <span class="live" id="sn-lv" role="status">Offline</span>
      <output class="sn-sc" id="sn-sc" aria-label="Score">0</output>
    </header>
    <!-- How far the score is from the next mark, the best or a place, under the
         header on a phone; on a desktop the score's card has it. -->
    <div class="gm-race">
      <span id="sn-bs"></span>
      <span class="gm-next" id="sn-nx" role="progressbar" aria-label="To the next place" aria-valuemin="0" aria-valuemax="100" hidden><i></i></span>
    </div>

    <main class="sn-main">
      <!-- The board. snake/main.js sizes the canvas to this box. -->
      <div class="sn-tbl" id="sn-t">
        <canvas id="sn-c" aria-label="Snake board"></canvas>
        <p class="sn-msg" id="sn-msg" role="status" aria-live="polite"></p>
      </div>
      <!-- This device's games first: they need no network and no account.
           Then the shared board, as last read when offline. -->
      <!-- The score, large, on a desktop, in the header's place. -->
      <section class="gm-score" aria-label="Score">
        <h2>Score</h2>
        <div class="gm-big"><output class="gm-num" id="sn-sc2">0</output></div>
        <span class="gm-next" id="sn-nx2" role="progressbar" aria-label="To the next place" aria-valuemin="0" aria-valuemax="100" hidden><i></i></span>
        <p class="gm-best" id="sn-nt"></p>
      </section>
      <section class="sn-board" aria-label="Scores">
        <div class="sn-lists">
          <h2>Your best</h2>
          <ol id="sn-my"></ol>
          <p class="sn-me" id="sn-mn"></p>
          <h2>Everyone</h2>
          <ol id="sn-lb"></ol>
          <p class="sn-me" id="sn-me"></p>
        </div>
        <button type="button" class="sn-go" id="sn-go">Play</button>
      </section>
    </main>

    <script src="/snake.js" defer></script>
  </body>
</html>
