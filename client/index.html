<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Search</title>
    <link rel="icon" href="/go-favicon.png" type="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="utopian-go" />
    <meta property="og:description" content="Search the web. Instantly." />
    <meta property="og:image" content="/og.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-fa="" data-sw="/swap.js">
    <div class="chrome" id="chrome">
      <header id="hd">
        <a class="lg" href="/" id="lg" aria-label="utopian-go home">
          <img
            class="lg-mark"
            src="/go-wordmark.svg"
            alt="utopian-go"
            width="188"
            height="64"
            decoding="async"
          />
        </a>
        <form class="sf" id="f" role="search">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            placeholder="Search"
            autocomplete="off"
            spellcheck="false"
            autofocus
          />
          <div class="sf-actions">
            <button id="cl" type="button" class="sf-clear" aria-label="Clear" hidden>
              <span aria-hidden="true">×</span>
            </button>
            <span class="sf-sep" aria-hidden="true" hidden></span>
            <button id="go" type="submit" class="sf-go" aria-label="Search">
              <span class="bl" aria-hidden="true">↵</span>
              <span class="sp" aria-hidden="true"></span>
            </button>
          </div>
        </form>

        <!-- Filled server-side with live prices; empty until then. -->
        <div id="hm-tk"></div>
      </header>

      <nav id="tb" hidden></nav>
    </div>

    <div id="st" role="status" aria-live="polite" hidden></div>

    <div id="mn">
      <div>
        <div id="sk" hidden></div>
        <div id="rs" class="rs"></div>
      </div>
      <aside id="sd" hidden></aside>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
