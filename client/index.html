<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Search</title>
    <link rel="icon" href="/go-favicon.png" type="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="utopian-go" />
    <meta property="og:description" content="Search the web. Instantly." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <!-- The layout is entirely keyed off this class, so it ships with the
       document: the server swaps it to "res" when the URL carries a query.
       Left to app.js it would land a round trip after first paint, and the
       whole header would jump into place in front of the reader. -->
  <body class="home" data-fa="" data-sw="/swap.js" data-cn="/connect.js" data-qr="/qr.js" data-lg="/login.js" data-hv="/hive.js">
    <div class="chrome" id="chrome">
      <header id="hd">
        <a class="lg" href="/" id="lg" aria-label="utopian-go home">
          <img
            class="lg-mark"
            src="/go-wordmark.svg"
            alt="utopian-go"
            width="188"
            height="64"
            decoding="async"
          />
        </a>
        <!-- Never used while the bundle is there — app.js preventDefaults the
             submit. They are what the field falls back to if it isn't. -->
        <form class="sf" id="f" role="search" action="/" method="get">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            placeholder="Search"
            autocomplete="off"
            spellcheck="false"
            autofocus
          />
          <div class="sf-actions">
            <button id="cl" type="button" class="sf-clear" aria-label="Clear" hidden>
              <span aria-hidden="true">×</span>
            </button>
            <span class="sf-sep" aria-hidden="true" hidden></span>
            <button id="go" type="submit" class="sf-go" aria-label="Search">
              <span class="bl" aria-hidden="true">↵</span>
              <span class="sp" aria-hidden="true"></span>
            </button>
          </div>
        </form>

        <!-- Filled server-side with live prices; empty until then. -->
        <div id="hm-tk"></div>

        <!-- The account control. Ships empty and is filled by app.js from
             localStorage, because the server has no idea who is looking: there
             is no cookie and no session, which is the point. Shipping a
             "Login" here instead would paint the wrong answer for everyone who
             is already logged in, and an empty box costs nothing to correct.
             It is position:fixed, so it reserves no space and shifts nothing
             whichever way it resolves. -->
        <nav id="ac" aria-label="Account"></nav>
      </header>

      <!-- Results-page loading chrome, shipped with the document instead of
           built by app.js. On a /?q= URL this is exactly what the page looks
           like while the search is in flight, so the bundle taking over moves
           nothing. body.home hides all of it, so the home page pays only the
           (heavily repetitive, near-free) bytes.

           renderTabs() in render.js rebuilds this nav from TABS — the two have
           to stay identical or the hand-off shifts the page. build-client.mjs
           checks that on every build. -->
      <nav id="tb" aria-busy="true">
        <button type="button" class="tab on" disabled>Web</button>
        <button type="button" class="tab" disabled>Images</button>
        <button type="button" class="tab" disabled>News</button>
        <button type="button" class="tab" disabled>Videos</button>
        <button type="button" class="tab" disabled>Discussions</button>
      </nav>
    </div>

    <div id="st" role="status" aria-live="polite" hidden></div>

    <div id="mn">
      <div>
        <!-- Three blocks, each mirroring a real .r card line for line. dom.js
             reads its skeleton template back out of here rather than keeping a
             second copy, so this markup is the only definition of it. -->
        <div id="sk">
          <div class="sk"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="sk"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="sk"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div id="rs" class="rs"></div>
      </div>

      <!-- The right column, holding the knowledge panel and the footer under
           it. They are siblings rather than nested because render.js rebuilds
           #sd from scratch on every paint and would take the footer with it. -->
      <div id="sc">
        <aside id="sd" hidden></aside>
        <footer id="ft">
          <!-- Documents, not pages: scripts/legal-pdf.mjs typesets these from
               client/legal/ into public/ at build time. -->
          <a href="/terms.pdf" target="_blank" rel="noopener">Terms</a>
          <a href="/privacy.pdf" target="_blank" rel="noopener">Privacy</a>
          <a href="https://x.com/UtopianContrib" target="_blank" rel="noopener"
            >X</a
          >
          <a
            href="https://pump.fun/coin/HGTXnhgyast5fJKhMcE4VgyeEVWhYKEsHxpZtpjhrYqA"
            target="_blank"
            rel="noopener"
            >$UTCC</a
          >
          <!--
            The result language, at the far end of the row.

            The options live in the document rather than in app.js because
            fifty native names weigh about a kilobyte, which the document's
            budget has room for and the bundle's has not — see PAGES in
            scripts/build-client.mjs. Shipping them in the markup also means
            the control works from the moment the footer paints, with no
            second round trip to populate it.

            src/lib/lang.ts is the authoritative half of this list: it maps
            each of these codes to the Brave country and market that go with
            it, and answers anything it does not recognise with English. Edit
            the two together; drift here costs a default, not a failed search.
          -->
          <span class="ft-lang">
            <!--
              The label is a span and the select sits over it invisibly.

              A select is always as wide as its widest option, whichever one is
              selected — here "Português (BR)", which left every shorter
              language trailing fifty-odd pixels of dead space inside the
              control. Drawn as its own label it is as wide as it looks, which
              is what lets the home footer centre it. lang.js keeps the two in
              step; aria-hidden because the select announces the same value.
            -->
            <span id="lgl" class="ft-lang-t" aria-hidden="true">English</span>
            <select id="lang" aria-label="Result language">
              <option value="en">English</option>
              <option value="en-gb">English (UK)</option>
              <option value="ar">العربية</option>
              <option value="eu">Euskara</option>
              <option value="bn">বাংলা</option>
              <option value="bg">Български</option>
              <option value="ca">Català</option>
              <option value="zh-hans">中文（简体）</option>
              <option value="zh-hant">中文（繁體）</option>
              <option value="hr">Hrvatski</option>
              <option value="cs">Čeština</option>
              <option value="da">Dansk</option>
              <option value="nl">Nederlands</option>
              <option value="et">Eesti</option>
              <option value="fi">Suomi</option>
              <option value="fr">Français</option>
              <option value="gl">Galego</option>
              <option value="de">Deutsch</option>
              <option value="gu">ગુજરાતી</option>
              <option value="he">עברית</option>
              <option value="hi">हिन्दी</option>
              <option value="hu">Magyar</option>
              <option value="is">Íslenska</option>
              <option value="it">Italiano</option>
              <option value="jp" data-l="ja">日本語</option>
              <option value="kn">ಕನ್ನಡ</option>
              <option value="ko">한국어</option>
              <option value="lv">Latviešu</option>
              <option value="lt">Lietuvių</option>
              <option value="ms">Melayu</option>
              <option value="ml">മലയാളം</option>
              <option value="mr">मराठी</option>
              <option value="nb">Norsk</option>
              <option value="pl">Polski</option>
              <option value="pt-br">Português (BR)</option>
              <option value="pt-pt">Português (PT)</option>
              <option value="pa">ਪੰਜਾਬੀ</option>
              <option value="ro">Română</option>
              <option value="ru">Русский</option>
              <option value="sr">Српски</option>
              <option value="sk">Slovenčina</option>
              <option value="sl">Slovenščina</option>
              <option value="es">Español</option>
              <option value="sv">Svenska</option>
              <option value="ta">தமிழ்</option>
              <option value="te">తెలుగు</option>
              <option value="th">ไทย</option>
              <option value="tr">Türkçe</option>
              <option value="uk">Українська</option>
              <option value="vi">Tiếng Việt</option>
            </select>
          </span>
        </footer>
      </div>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
