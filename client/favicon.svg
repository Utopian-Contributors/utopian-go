  <!-- The frog from frog-icon.svg, put back on the pixel grid it was drawn on.
       That file is a trace: 623 curved paths and 221 KB for a sprite. Here each
       sprite pixel is a rectangle again, one path per colour, in the trace's
       own units, so the frog keeps its size and shape in 13 KB.
       The darkest green goes down first as the whole silhouette and the other
       colours are drawn over it. At tab sizes a sprite pixel is smaller than a
       screen pixel, and where two antialiased edges meet, whatever is beneath
       shows through the seam; over the silhouette, that is the frog's outline.
       The disc is the one the GO favicon sat on, without its ring: the field
       surface every input on the site has (the field tokens in app.css), white
       by day and #202124 by night. Where a tab strip is the disc's own colour,
       the frog stands on its own. The disc is centred on the smallest circle
       that holds the frog and sized so the frog clears its edge, which puts
       the frog across 78% of the icon, the share the GO's letters had.
       Browsers apply the media query to SVG favicons by the browser's theme.
       favicon.png is the daylight disc for those that take no SVG. -->
  <style>
    circle { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      circle { fill: #202124; }
    }
  </style>
