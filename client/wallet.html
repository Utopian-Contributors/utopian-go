<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No zoom on phones, by any means: not onto a focused field, not by
         pinch or double-tap. iOS ignores this for gestures; noZoom() in
         client/js/device.js refuses those. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Wallet</title>
    <link rel="icon" href="/go-favicon.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/go-favicon.svg" type="image/svg+xml" />
    <!-- A page about one visitor's money has no business in a search index or
         on a social card. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/wallet.css" />
  </head>
  <body class="res wl-pg" data-lg="/login.js" data-cn="/connect.js" data-sw="/swap.js" data-qr="/qr.js" data-ks="/keys.js">
    <!-- The search header, as on search and Social: the mark, the field, the
         account control. app.css (built into this page's sheet) lays it out. -->
    <div class="chrome" id="chrome">
      <header id="hd">
        <a class="lg" href="/" id="lg" aria-label="utopian-go home">
          <img
            class="lg-mark"
            src="/go-wordmark.svg"
            alt=""
            width="188"
            height="64"
            decoding="async"
          />
        </a>
        <form class="sf" id="f" role="search" action="/" method="get">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            placeholder="Search"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="sf-actions">
            <button id="go" type="submit" class="sf-go" aria-label="Search">
              <span class="bl" aria-hidden="true">↵</span>
            </button>
          </div>
        </form>
        <button type="button" class="hb" id="bk">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Back
        </button>
        <nav id="ac" aria-label="Account"></nav>
      </header>
    </div>

    <main class="wrap" id="wl">
      <div class="wl-main">
        <div class="wl-ph" id="wl-ph" hidden></div>
        <section class="wl-pf" aria-labelledby="wl-pf-h">
          <!-- Shipped in its final geometry so the bundle taking over moves
               nothing. A dash, not a zero: no balance reads as empty before it
               has been read. -->
          <div class="wl-tot">
            <h2 class="wl-k" id="wl-pf-h">Portfolio</h2>
            <div class="wl-vr">
              <strong class="wl-v" id="wl-v">—</strong>
              <span class="wl-d" id="wl-d" hidden></span>
            </div>
            <div class="wl-c" id="wl-c" hidden></div>
            <div class="wl-acts" id="wl-acts" hidden>
              <button type="button" class="wl-a" data-act="receive">Receive</button>
              <button type="button" class="wl-a" data-act="send">Send</button>
              <button type="button" class="wl-a" data-act="swap">Swap</button>
            </div>
          </div>
          <div id="wl-l"></div>
          <p class="wl-n" id="wl-n">Reading your wallet…</p>
          <div id="wl-x"></div>
        </section>
        <section class="wl-top" aria-labelledby="wl-th">
          <h2 class="wl-k" id="wl-th">Trending</h2>
          <input
            class="wl-q"
            id="wl-q"
            type="search"
            placeholder="Search all tokens"
            aria-label="Search all tokens"
            autocomplete="off"
            spellcheck="false"
            maxlength="64"
          />
          <div id="wl-tl"></div>
          <p class="wl-n" id="wl-tn" hidden></p>
        </section>
      </div>
      <aside class="wl-side" id="wl-s" aria-label="Selected token" aria-live="polite"></aside>
    </main>

    <footer id="ft" class="wrap">
      <a href="/terms.pdf" target="_blank" rel="noopener">Terms</a>
      <a href="/privacy.pdf" target="_blank" rel="noopener">Privacy</a>
      <a href="https://x.com/UtopianContrib" target="_blank" rel="noopener"
        >X</a
      >
      <a
        href="https://pump.fun/coin/HGTXnhgyast5fJKhMcE4VgyeEVWhYKEsHxpZtpjhrYqA"
        target="_blank"
        rel="noopener"
        >$UTCC</a
      >
    </footer>

    <script src="/wallet.js" defer></script>
  </body>
</html>
