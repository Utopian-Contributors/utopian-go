<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Wallet</title>
    <link rel="icon" href="/go-favicon.png" type="image/png" />
    <!-- A page about one visitor's money has no business in a search index or
         on a social card. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/wallet.css" />
  </head>
  <body data-cn="/connect.js" data-sw="/swap.js" data-qr="/qr.js" data-ks="/keys.js">
    <!-- One header row: the mark on the left, the account on the right. The
         search shell has to pin its account control out of flow because it has
         two header layouts to avoid disturbing; this page has one, so the
         control is simply in it. -->
    <header class="wl-h wrap">
      <a class="lg" href="/" aria-label="utopian-go home">
        <img
          class="lg-mark"
          src="/go-wordmark.svg"
          alt="utopian-go"
          width="188"
          height="64"
          decoding="async"
        />
      </a>
      <nav id="ac" aria-label="Account"></nav>
    </header>

    <main class="wrap" id="wl">
      <div class="wl-main">
        <div class="wl-ph" id="wl-ph" hidden></div>
        <section class="wl-pf" aria-labelledby="wl-pf-h">
          <!-- Shipped in its final geometry so the bundle taking over moves
               nothing. A dash, not a zero: no balance reads as empty before it
               has been read. -->
          <div class="wl-tot">
            <h2 class="wl-k" id="wl-pf-h">Portfolio</h2>
            <div class="wl-vr">
              <strong class="wl-v" id="wl-v">—</strong>
              <span class="wl-d" id="wl-d" hidden></span>
            </div>
            <div class="wl-c" id="wl-c" hidden></div>
            <div class="wl-acts" id="wl-acts" hidden>
              <button type="button" class="wl-a" data-act="receive">Receive</button>
              <button type="button" class="wl-a" data-act="send">Send</button>
              <button type="button" class="wl-a" data-act="swap">Swap</button>
            </div>
          </div>
          <div id="wl-l"></div>
          <p class="wl-n" id="wl-n">Reading your wallet…</p>
          <div id="wl-x"></div>
        </section>
        <section class="wl-top" aria-labelledby="wl-th">
          <h2 class="wl-k" id="wl-th">Trending</h2>
          <input
            class="wl-q"
            id="wl-q"
            type="search"
            placeholder="Search all tokens"
            aria-label="Search all tokens"
            autocomplete="off"
            spellcheck="false"
            maxlength="64"
          />
          <div id="wl-tl"></div>
          <p class="wl-n" id="wl-tn" hidden></p>
        </section>
      </div>
      <aside class="wl-side" id="wl-s" aria-label="Selected token" aria-live="polite"></aside>
    </main>

    <footer id="ft" class="wrap">
      <a href="/terms.pdf" target="_blank" rel="noopener">Terms</a>
      <a href="/privacy.pdf" target="_blank" rel="noopener">Privacy</a>
      <a href="https://x.com/UtopianContrib" target="_blank" rel="noopener"
        >X</a
      >
      <a
        href="https://pump.fun/coin/HGTXnhgyast5fJKhMcE4VgyeEVWhYKEsHxpZtpjhrYqA"
        target="_blank"
        rel="noopener"
        >$UTCC</a
      >
    </footer>

    <script src="/wallet.js" defer></script>
  </body>
</html>
