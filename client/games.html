<!doctype html>
<html lang="en" data-sec="games">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Games</title>
    <link rel="icon" href="/ic-games.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/ic-games.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#bd332d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6e1b17" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/games.css" />
  </head>
  <body class="gm">
    <!-- Back home, as the app's other pages have it, and the page's name. -->
    <header class="gm-hd">
      <a class="gm-back" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back
      </a>
      <h1>Games</h1>
    </header>

    <!-- The games laid out as the home page's tiles (#hm-nv): Fruit Slots the
         tall tile, three rows high, drawn with its reels caught mid-spin;
         Pinball, drawn with its table, Snake under its apple and Shotgun
         under a shell stack beside it. Each is its own page, anyone's, signed
         in or not. games.js keeps the list and every game in it offline
         (client/sw GAMES, TILE_MARKS). -->
    <main>
      <ul class="gm-list">
        <li class="gm-tall">
          <a class="gm-card gm-slots" href="/slots">
            <img class="gm-shot" src="/game-slots.webp" alt="" width="640" height="607" />
            <strong>Fruit Slots</strong>
            <span>Hit 1,000 to win a fruit status</span>
          </a>
        </li>
        <li>
          <a class="gm-card gm-pinball" href="/pinball">
            <img class="gm-shot" src="/game-pinball.webp" alt="" width="585" height="740" />
            <strong>Pinball</strong>
            <span>Flippers, ramps and multiball</span>
          </a>
        </li>
        <li>
          <a class="gm-card gm-snake" href="/snake">
            <img src="/ic-apple.svg" alt="" width="32" height="32" />
            <strong>Snake</strong>
            <span>Eat, grow, mind your tail</span>
          </a>
        </li>
        <li>
          <a class="gm-card gm-shotgun" href="/shotgun">
            <img src="/ic-shell.svg" alt="" width="32" height="32" />
            <strong>Shotgun</strong>
            <span>Spin the wheel, hold off the waves</span>
          </a>
        </li>
      </ul>
    </main>

    <script src="/games.js" defer></script>
  </body>
</html>
