<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No zoom on phones, by any means: not onto a focused field, not by
         pinch or double-tap. iOS ignores this for gestures; noZoom() in
         client/js/device.js refuses those.
         No viewport-fit=cover: in the home-screen app on iOS, under the default
         status bar, it makes the page a status bar taller than the screen and
         pushes the bottom navigation off it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Social</title>
    <link rel="icon" href="/go-favicon.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/go-favicon.svg" type="image/svg+xml" />
    <!-- The installed app: its name and icons are in the manifest. iOS reads the
         touch icon and the title from here instead, and without the title
         would name the home-screen icon after this page. application-name is
         that same fallback for Chromium: a home-screen shortcut, or an install
         that gave up waiting for the manifest, is named from it rather than
         from a <title> the social pages rewrite per view. The theme colour is
         the page's own background, which tints the installed app's status
         bar and title bar to match it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#fffff6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282124" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/social.css" />
  </head>
  <body class="res soc" data-qr="/qr.js" data-ch="/chat.js" data-rc="/rec.js" data-rl="/rail.js" data-av="/avatar.js" data-pw="/install.js">
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <symbol id="pi" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="8.5" cy="10" r="1.5" fill="currentColor" />
        <path d="M4 17l4.5-4 3 2.5L14 13l6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>
      <!-- Voice memos: the composer's button, and a memo's play and pause. -->
      <symbol id="au" viewBox="0 0 24 24">
        <path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="mp" viewBox="0 0 24 24">
        <path d="M8 5.8v12.4a1 1 0 0 0 1.5.86l10-6.2a1 1 0 0 0 0-1.72l-10-6.2A1 1 0 0 0 8 5.8z" fill="currentColor" />
      </symbol>
      <symbol id="mz" viewBox="0 0 24 24">
        <rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor" />
        <rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor" />
      </symbol>
      <!-- The section tabs: the bottom bar on phones, the left column on wider
           screens. The timeline's filters draw from here too. -->
      <symbol id="n-tl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" />
      </symbol>
      <symbol id="n-sv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" />
      </symbol>
      <symbol id="n-fr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="9" cy="8" r="3.2" />
        <path d="M3 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5" />
        <circle cx="17" cy="9" r="2.5" />
        <path d="M17 14.2c2.4.3 4 2.2 4 4.8" />
      </symbol>
      <symbol id="n-ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M5 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z" />
      </symbol>
      <symbol id="n-me" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20.5c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
      </symbol>
    </svg>
    <div class="chrome" id="chrome">
      <header id="hd">
        <a class="lg" href="/" id="lg" aria-label="utopian-go home">
          <img
            class="lg-mark"
            src="/go-wordmark.svg"
            alt=""
            width="188"
            height="64"
            decoding="async"
          />
        </a>
        <form class="sf" id="f" role="search" action="/" method="get">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            placeholder="Search"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="sf-actions">
            <button id="go" type="submit" class="sf-go" aria-label="Search">
              <span class="bl" aria-hidden="true">↵</span>
            </button>
          </div>
        </form>
        <button type="button" class="hb" id="bk">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Back
        </button>
        <nav id="ac" aria-label="Account">
          <!-- Swapped for Log in while nobody is signed in, as on every page. -->
          <a class="ac-w" href="/wallet" id="aw">Wallet</a>
          <button type="button" class="ac-w ac-in" id="in" hidden>Log in</button>
          <a class="ac-b" href="/">Go Search</a>
          <button type="button" id="out" hidden>Log out</button>
        </nav>
      </header>
      <nav id="tb" aria-label="Social">
        <a class="tab" href="/social" data-nav="timeline"><svg class="ni" aria-hidden="true"><use href="#n-tl" /></svg><span>Timeline</span><i id="badge" hidden></i></a>
        <a class="tab" href="/social/friends" data-nav="friends"><svg class="ni" aria-hidden="true"><use href="#n-fr" /></svg><span>Friends</span></a>
        <a class="tab" href="/social/c" data-nav="chat"><svg class="ni" aria-hidden="true"><use href="#n-ch" /></svg><span>Messenger</span><i id="mbadge" hidden></i></a>
        <a class="tab" href="/social" id="me" data-nav="profile"><svg class="ni" aria-hidden="true"><use href="#n-me" /></svg><span><b class="my">My </b>Profile</span></a>
      </nav>
    </div>

    <div id="mn">
      <div id="m">
        <p class="muted">…</p>
        <noscript><p>Social needs JavaScript.</p></noscript>
      </div>
      <div id="sc">
        <aside id="sd">
          <div class="pn" id="side"></div>
        </aside>
      </div>
    </div>
    <!-- Outside #mn, so on wider screens it runs the width of the page, under the tabs too. -->
    <footer id="ft">
      <a href="/terms.pdf" target="_blank" rel="noopener">Terms</a>
      <a href="/privacy.pdf" target="_blank" rel="noopener">Privacy</a>
      <a href="https://x.com/UtopianContrib" target="_blank" rel="noopener">X</a>
      <a
        href="https://pump.fun/coin/HGTXnhgyast5fJKhMcE4VgyeEVWhYKEsHxpZtpjhrYqA"
        target="_blank"
        rel="noopener"
        >$UTCC</a
      >
    </footer>

    <dialog id="qd" aria-labelledby="qt">
      <h2 id="qt">Solana wallet</h2>
      <div id="qc"></div>
      <p id="qa" class="addr"></p>
      <p id="qk" class="hint" hidden>Copied</p>
      <form id="pf">
        <label for="pamt">Amount in SOL</label>
        <div class="pay-line">
          <input id="pamt" inputmode="decimal" autocomplete="off" placeholder="0.00" />
          <button type="submit" id="py">Pay</button>
        </div>
        <p id="phint" class="hint">Your wallet signs this payment.</p>
        <p id="pe" class="err" role="alert"></p>
        <p id="pok" class="hint" hidden></p>
      </form>
    </dialog>
    <script src="/social.js" defer></script>
  </body>
</html>
