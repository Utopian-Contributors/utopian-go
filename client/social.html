<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No zoom on phones, by any means: not onto a focused field, not by
         pinch or double-tap. iOS ignores this for gestures; noZoom() in
         client/js/device.js refuses those.
         No viewport-fit=cover: in the home-screen app on iOS, under the default
         status bar, it makes the page a status bar taller than the screen and
         pushes the bottom navigation off it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Social</title>
    <!-- The tab wears the page's own icon, the friends one its link has on the
         home page, rather than the GO the search page wears. -->
    <link rel="icon" href="/ic-social.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/ic-social.svg" type="image/svg+xml" />
    <!-- The installed app: its name and icons are in the manifest. iOS reads the
         touch icon and the title from here instead, and without the title
         would name the home-screen icon after this page. application-name is
         that same fallback for Chromium: a home-screen shortcut, or an install
         that gave up waiting for the manifest, is named from it rather than
         from a <title> the social pages rewrite per view. The theme colour is
         the page's own background, which tints the installed app's status
         bar and title bar to match it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#fffff6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282124" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/social.css" />
  </head>
  <body class="res soc" data-qr="/qr.js" data-py="/pay.js" data-ch="/chat.js" data-rc="/rec.js" data-rl="/rail.js" data-ad="/ads.js" data-av="/avatar.js" data-pw="/install.js" data-lg="/login.js" data-cp="/compose.js" data-cc="/coins.js" data-pv="/photos.js" data-sw="/swap.js" data-fr="/friends.js" data-nt="/notes.js" data-ed="/edit.js">
    <!-- The loading bar (base.css .ptr), creeping from the first paint; social.js takes it over and fills it. -->
    <div class="ptr boot"></div>
    <div class="chrome" id="chrome">
      <header id="hd">
        <a class="lg" href="/" id="lg" aria-label="utopian-go home">
          <img
            class="lg-mark"
            src="/go-wordmark.svg"
            alt=""
            width="188"
            height="64"
            decoding="async"
          />
        </a>
        <form class="sf" id="f" role="search" action="/" method="get">
          <input
            id="q"
            name="q"
            type="search"
            enterkeyhint="search"
            placeholder="Search"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="sf-actions">
            <button id="go" type="submit" class="sf-go" aria-label="Search">
              <span class="bl" aria-hidden="true">↵</span>
            </button>
          </div>
        </form>
        <button type="button" class="hb" id="bk">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Back
        </button>
        <nav id="ac" aria-label="Account">
          <!-- Swapped for Log in while nobody is signed in, as on every page. -->
          <a class="ac-w" href="/wallet" id="aw">Wallet</a>
          <a class="ac-w ac-in" href="/wallet" id="in" hidden>Log in</a>
          <button type="button" class="ac-out" id="out" hidden>Log out</button>
        </nav>
      </header>
      <nav id="tb" aria-label="Social">
        <a class="tab" href="/social" data-nav="timeline"><img class="ni" src="/ic-home.svg" alt="" width="24" height="24" /><span>Timeline</span></a>
        <a class="tab" href="/social/friends" data-nav="friends"><img class="ni" src="/ic-social.svg" alt="" width="24" height="24" /><span>Friends</span></a>
        <a class="tab" href="/social/c" data-nav="chat"><img class="ni" src="/ic-chat.svg" alt="" width="24" height="24" /><span>Messenger</span><i id="mbadge" hidden></i></a>
        <a class="tab" href="/social/notifications" data-nav="notifications"><img class="ni" src="/ic-bell.svg" alt="" width="24" height="24" /><span>Notifications</span><i id="badge" hidden></i></a>
        <a class="tab" href="/social" id="me" data-nav="profile"><img class="ni" src="/ic-person.svg" alt="" width="24" height="24" /><span><b class="my">My </b>Profile</span></a>
        <!-- Wide screens only; social.css hides it on a phone. -->
        <a class="tab tab-ad" href="/social/ads" data-nav="ads"><img class="ni" src="/ic-wand.svg" alt="" width="24" height="24" /><span>Advertise</span></a>
        <!-- The account's $UTCC, wide screens only. social.js gives it the coin's
             link and logo (client/js/utcc.js has the mint) and shows it once
             there is a figure to put in it. -->
        <a class="tb-bal" id="bal" hidden>
          <img class="tb-bal-ic" id="balic" alt="" width="24" height="24" decoding="async" />
          <span class="tb-bal-t"><small>$UTCC balance</small><b class="tb-bal-n" id="baln"></b><b class="tb-bal-s" id="bals" aria-hidden="true"></b></span>
        </a>
      </nav>
    </div>

    <div id="mn">
      <div id="m">
        
        <noscript><p>Social needs JavaScript.</p></noscript>
      </div>
      <!-- A post, over the timeline (social.css #pv): the timeline under it stays put for Back. -->
      <div id="pv" hidden></div>
      <div id="sc">
        <aside id="sd">
          <div class="pn" id="side"></div>
        </aside>
      </div>
    </div>
    <!-- Outside #mn, so on wider screens it runs the width of the page, under the tabs too. -->
    <footer id="ft">
      <a href="/terms.pdf" target="_blank" rel="noopener">Terms</a>
      <a href="/privacy.pdf" target="_blank" rel="noopener">Privacy</a>
      <a href="https://x.com/UtopianContrib" target="_blank" rel="noopener">X</a>
    </footer>

    <script src="/social.js" defer></script>
    <!-- The offline panel (client/offline): after the page, never ahead of it. -->
    <script src="/offline.js" defer></script>
  </body>
</html>
