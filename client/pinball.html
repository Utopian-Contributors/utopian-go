<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Pinball</title>
    <link rel="icon" href="/ic-pinball.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/ic-pinball.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#fffff6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#292124" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/pinball.css" />
  </head>
  <body class="pb">
    <!-- Back, as the app's other pages have it; the balls left and the score. -->
    <header class="pb-hd">
      <button type="button" class="pb-back" id="pb-bk">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back
      </button>
      <span class="pb-balls" id="pb-bn" role="img" aria-label="3 balls left">●●●</span>
      <span class="pb-x" id="pb-x" hidden>×2</span>
      <output class="pb-sc" id="pb-sc" aria-label="Score">0</output>
    </header>

    <main class="pb-main">
      <!-- The table. pinball/main.js sizes the canvas to this box. -->
      <div class="pb-tbl" id="pb-t">
        <canvas id="pb-c" aria-label="Pinball table"></canvas>
        <p class="pb-msg" id="pb-msg" role="status" aria-live="polite"></p>
      </div>
      <!-- This device's games first: they need no network and no account.
           Then the shared board, as last read when offline. -->
      <section class="pb-board" aria-label="Scores">
        <h2>Your best</h2>
        <ol id="pb-my"></ol>
        <p class="pb-me" id="pb-mn"></p>
        <h2>Everyone</h2>
        <ol id="pb-lb"></ol>
        <p class="pb-me" id="pb-me"></p>
      </section>
    </main>

    <!-- The flippers. Held, they hold their flipper up; with a ball waiting
         in the shooter lane, either one pulls the plunger and lets it go. -->
    <div class="pb-btns">
      <button type="button" class="pb-b" id="pb-l" aria-label="Left flipper"><span aria-hidden="true">Z</span></button>
      <button type="button" class="pb-b" id="pb-r" aria-label="Right flipper"><span aria-hidden="true">/</span></button>
    </div>

    <script src="/pinball.js" defer></script>
  </body>
</html>
