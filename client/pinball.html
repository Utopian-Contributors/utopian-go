<!doctype html>
<html lang="en" data-sec="games">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Pinball | Play Free Online | UtopianGO</title>
    <!-- What a search result and a shared link say of the page. %SITE% is the
         public origin, filled in by the build (scripts/build-client.mjs SITE). -->
    <meta name="description" content="A pinball table with flippers, ramps and multiball, free in your browser. Beat your best and climb the shared leaderboard." />
    <link rel="canonical" href="%SITE%/pinball" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UtopianGO" />
    <meta property="og:title" content="Pinball" />
    <meta property="og:description" content="A pinball table with flippers, ramps and multiball, free in your browser. Beat your best and climb the shared leaderboard." />
    <meta property="og:url" content="%SITE%/pinball" />
    <meta property="og:image" content="%SITE%/og-pinball.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/ic-games.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/ic-games.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#bd332d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6e1b17" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/pinball.css" />
  </head>
  <body class="pb">
    <!-- Back, as the app's other pages have it, and the score. The balls left are on the table's apron. -->
    <header class="pb-hd">
      <button type="button" class="pb-back" id="pb-bk">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back
      </button>
      <span class="live" id="pb-lv" role="status">Offline</span>
      <span class="pb-x" id="pb-x" hidden>×2</span>
      <output class="pb-sc" id="pb-sc" aria-label="Score">0</output>
    </header>
    <!-- How far the score is from the next mark, the best or a place, under the
         header on a phone; on a desktop the score's card has it. -->
    <div class="gm-race">
      <span id="pb-nl"></span>
      <span class="gm-next" id="pb-nx" role="progressbar" aria-label="To the next place" aria-valuemin="0" aria-valuemax="100" hidden><i></i></span>
    </div>

    <main class="pb-main">
      <!-- The table. pinball/main.js sizes the canvas to this box. -->
      <div class="pb-tbl" id="pb-t">
        <canvas id="pb-c" aria-label="Pinball table"></canvas>
        <p class="pb-msg" id="pb-msg" role="status" aria-live="polite"></p>
      </div>
      <!-- This device's games first: they need no network and no account.
           Then the shared board, as last read when offline. -->
      <!-- The score, large, on a desktop, in the header's place. -->
      <section class="gm-score" aria-label="Score">
        <h2>Score</h2>
        <div class="gm-big"><output class="gm-num" id="pb-sc2">0</output></div>
        <span class="gm-next" id="pb-nx2" role="progressbar" aria-label="To the next place" aria-valuemin="0" aria-valuemax="100" hidden><i></i></span>
        <p class="gm-best" id="pb-nt"></p>
      </section>
      <section class="pb-board" aria-label="Scores">
        <h2>Your best</h2>
        <ol id="pb-my"></ol>
        <p class="pb-me" id="pb-mn"></p>
        <h2>Everyone</h2>
        <ol id="pb-lb"></ol>
        <p class="pb-me" id="pb-me"></p>
      </section>
    </main>

    <!-- The flippers. Held, they hold their flipper up; with a ball waiting
         in the shooter lane, either one pulls the plunger and lets it go. -->
    <div class="pb-btns">
      <button type="button" class="pb-b" id="pb-l" aria-label="Left flipper"><span aria-hidden="true">Z</span></button>
      <button type="button" class="pb-b" id="pb-r" aria-label="Right flipper"><span aria-hidden="true">/</span></button>
    </div>

    <script src="/pinball.js" defer></script>
  </body>
</html>
