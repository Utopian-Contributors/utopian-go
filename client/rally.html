<!doctype html>
<html lang="en" data-sec="games">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Rally | Play Free Online | UtopianGO</title>
    <!-- What a search result and a shared link say of the page. %SITE% is the
         public origin, filled in by the build (scripts/build-client.mjs SITE). -->
    <meta name="description" content="A 3D rally lap with hills, jumps, a loop and boosts, free in your browser. Race your ghost, collect credits for new cars and climb the leaderboard." />
    <link rel="canonical" href="%SITE%/rally" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UtopianGO" />
    <meta property="og:title" content="Rally" />
    <meta property="og:description" content="A 3D rally lap with hills, jumps, a loop and boosts, free in your browser. Race your ghost, collect credits for new cars and climb the leaderboard." />
    <meta property="og:url" content="%SITE%/rally" />
    <meta property="og:image" content="%SITE%/og-rally.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/ic-games.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/ic-games.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UtopianGO" />
    <meta name="application-name" content="UtopianGO" />
    <meta name="theme-color" content="#bd332d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6e1b17" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/rally.css" />
  </head>
  <body class="rl">
    <!-- Back and, beside it, Synced or Offline (signed in, a synced race's
         lap goes on the board and its credits to the account); the credits on
         the right. -->
    <header class="rl-hd">
      <button type="button" class="rl-back" id="rl-bk">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back
      </button>
      <span class="live" id="rl-lv" role="status">Offline</span>
      <span class="rl-cr"><output id="rl-cr">0</output> credits</span>
    </header>

    <main class="rl-main">
      <!-- The course. rally/main.js sizes the canvas to this box. -->
      <div class="rl-stage" id="rl-st">
        <canvas id="rl-c" aria-label="Rally course"></canvas>

        <!-- In a race: the clock and the gap to the best, the speed, and the
             two boosts that can be carried. Coins go straight onto the
             credits in the header. -->
        <div class="rl-hud" aria-hidden="true">
          <div class="rl-time"><output id="rl-t">0:00.00</output><span id="rl-sp" class="rl-split"></span></div>
          <div class="rl-right">
            <span class="rl-kmh"><output id="rl-v">0</output> km/h</span>
            <span class="rl-boosts" id="rl-bo"><i></i><i></i></span>
          </div>
        </div>
        <p class="rl-msg" id="rl-msg" role="status" aria-live="polite" hidden></p>
        <button type="button" class="rl-pause" id="rl-pa" aria-label="Pause" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
        </button>

        <!-- On a touch screen: a stick to steer (pulled back, it brakes; in
             the air it rolls and pitches), the boost button between, showing
             how many boosts are carried, and the gas pedal. -->
        <div class="rl-stick" id="rl-sk" aria-hidden="true"><i id="rl-kn"></i></div>
        <button type="button" class="rl-boost" id="rl-bt" aria-label="Boost" data-n="0">
          <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13.5h6L9.8 22 19 9.8h-6.1z" fill="currentColor" /></svg>
          <span id="rl-bn">0</span>
        </button>
        <button type="button" class="rl-gas" id="rl-gs" aria-label="Gas">
          <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-1.6 17.2a1 1 0 0 1-1 .8H9.6a1 1 0 0 1-1-.8z" fill="currentColor" opacity=".9" /><path d="M9.5 7h5M9.3 10.5h5.4M9.1 14h5.8" stroke="rgba(0,0,0,.35)" stroke-width="1.4" stroke-linecap="round" /></svg>
        </button>

        <!-- Between races, over the course: the best lap, Race, the ghost, and
             the way to the store and the board. -->
        <section class="rl-panel" id="rl-pn" aria-label="Rally">
          <h1 id="rl-h1">Rally</h1>
          <p class="rl-res" id="rl-rs" role="status" aria-live="polite"></p>
          <p class="rl-best" id="rl-be"></p>
          <button type="button" class="rl-go" id="rl-go">Race</button>
          <label class="rl-tg">
            <input type="checkbox" id="rl-gh" />
            <span>Race against your ghost</span>
          </label>
          <div class="rl-row">
            <button type="button" class="rl-btn" id="rl-so">Store</button>
            <button type="button" class="rl-btn" id="rl-bd">Leaderboard</button>
          </div>
          <p class="rl-keys" id="rl-ky"></p>
        </section>

        <!-- Paused: go on, or start the lap again. -->
        <section class="rl-panel rl-paused" id="rl-pz" aria-label="Paused" hidden>
          <h2>Paused</h2>
          <button type="button" class="rl-go" id="rl-re">Resume</button>
          <div class="rl-row">
            <button type="button" class="rl-btn" id="rl-rs2">Restart</button>
            <button type="button" class="rl-btn" id="rl-qt">Quit</button>
          </div>
        </section>

        <!-- The store: cars to drive, for credits, each shown in 3D; the badges are the Shop's. -->
        <section class="rl-sheet" id="rl-sh" aria-label="Store" hidden>
          <header><h2>Store</h2><button type="button" class="rl-x" data-close aria-label="Close">×</button></header>
          <h3>Cars</h3>
          <ul class="rl-cars" id="rl-cs"></ul>
          <a class="rl-shop" href="/social/shop">
            <img src="/bd-rl5.svg" alt="" width="32" height="32" />
            <span><b>Rally badges</b>Spend banked credits on badges to wear after your name, in the Shop.</span>
          </a>
        </section>

        <!-- The board: this device's laps, and everyone's, fastest first. -->
        <section class="rl-sheet" id="rl-lb" aria-label="Leaderboard" hidden>
          <header><h2>Leaderboard</h2><button type="button" class="rl-x" data-close aria-label="Close">×</button></header>
          <h3>Your best</h3>
          <ol class="rl-list" id="rl-my"></ol>
          <p class="rl-note" id="rl-mn"></p>
          <h3>Everyone</h3>
          <ol class="rl-list" id="rl-all"></ol>
          <p class="rl-note" id="rl-an"></p>
        </section>
      </div>
    </main>

    <script src="/rally.js" defer></script>
  </body>
</html>
